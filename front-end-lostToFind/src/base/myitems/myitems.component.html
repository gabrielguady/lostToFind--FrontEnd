<div class="flex flex-column justify-content-center align-content-center px-4 m-5">
  <mat-card class="m-4">
    <mat-card-header>
      <div class="flex flex-row justify-content-between align-items-center w-full">
        <h2>Seus itens cadastrados</h2>
<!--        <button mat-flat-button (click)="goToPage('lost_item/create')" class="btn-default">-->
<!--          Cadastre um item perdido-->
<!--        </button>-->
      </div>
    </mat-card-header>
    <mat-card-content>
      <div class="flex flex-row justify-content-between align-items-start gap-3 w-full mt-3">
        <mat-form-field class="w-6"> <!-- Formulario -->
          <mat-label>Pesquisar titulo</mat-label>
          <input matInput [(ngModel)]="searchTitle">
        </mat-form-field>
        <mat-form-field class="w-6"> <!-- Formulario -->
          <mat-label>Pesquisar cidade</mat-label>
          <input matInput [(ngModel)]="searchCity">
        </mat-form-field>

        <button mat-fab type="submit" (click)="search()" class="btn-default">
          <mat-icon>search</mat-icon>
        </button>
      </div>
    </mat-card-content>
  </mat-card>


      <div class="flex flex-wrap justify-content-center gap-4">
        @for (items of dataSource; track items.title) {
          <div class="w-full">
            <mat-card class="cardWithShadow items">
              <!-- Imagem à esquerda -->
              <a routerLink="/photo">
                <img
                  src="https://material.angular.io/assets/img/examples/shiba2.jpg"
                  alt="imgSrc"
                  class="w-10rem border-round shadow-2"
                />
              </a>

              <!-- Conteúdo à direita -->
              <mat-card-content class="cardContent">
                <mat-card-title class="mat-headline-2 f-s-16 m-b-4">
                  {{ items.title }}
                </mat-card-title>

                <div class="d-flex align-items-center gap-2 mb-2">
                  <h3 class="mat-body-2 f-w-600 m-0">{{ items.city }}</h3>
                  <h5 class="mat-body-2 f-w-600 m-0">{{ items.date_found | date:'shortDate' }}</h5>
                </div>

                <!--            <p class="f-s-14 m-0">{{ items.last_seen_details }}</p>-->

                <button
                  mat-raised-button
                  class="mt-3"
                  matTooltip="meu item"
                  (click)="goToPage('photo')">
                  Item lost
                </button>
              </mat-card-content>
            </mat-card>
          </div>
        }
      </div>

      @if (dataSource.length === 0 && datalostItems.length === 0) {
        <div class="flex flex-center">
          <h2>Nenhum Item encontrado</h2>
        </div>
      }
    </div>
