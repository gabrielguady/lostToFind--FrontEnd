<!-- Header -->
<header class="app-header">
  <div class="flex align-items-center gap-2 px-3 py-2">
    <span class="text-black font-bold text-xl">Lost to Find</span>
    <div class="logo-mask">
      <video autoplay loop muted playsinline>
        <source src="assets/logo-moving.mp4" type="video/mp4" />
      </video>
    </div>
  </div>

  <!-- Botões à direita -->
  <div class="flex gap-4 ml-auto m-3">
    <button class=" lost-b " mat-button routerLink="/lost_item">Itens Perdidos</button>

    <div routerLinkActive="selected" [routerLinkActiveOptions]="{ exact: true }">
      <button class="found-b" mat-button routerLink="/found_item">
        Itens Encontrados
      </button>
    </div>

    <button class=" myitem-b " mat-button routerLink="/my_items">Meus Itens</button>
    <button class="user" mat-icon-button routerLink="/user">
      <mat-icon>account_circle</mat-icon>
    </button>
  </div>
</header>

<div class="flex justify-content-center px-4 mt-5">
  <div class="surface-card w-full md:w-11 lg:w-10 xl:w-9 p-5 shadow-3 border-round-xl">

    <h1>Recente itens achados</h1>

<div class="flex flex-column gap-1">
  <div class="flex gap-3">
    <mat-form-field> <!-- Formulario -->
      <mat-label>Pesquisar Nome</mat-label>
      <input matInput [(ngModel)]="searchName">
    </mat-form-field>
    <mat-form-field> <!-- Formulario -->
      <mat-label>Pesquisar descriçao</mat-label>
      <input matInput [(ngModel)]="searchDescription">
    </mat-form-field>
    <mat-form-field> <!-- Formulario -->
      <mat-label>Pesquisar cidade</mat-label>
      <input matInput [(ngModel)]="searchCity">
    </mat-form-field>

    <button mat-fab (click)="search()" class="btn-default">
      <mat-icon>search</mat-icon>
    </button>
    <button mat-fab (click)="goToPage('found_item/:action')" class="btn-default">
      <mat-icon>add</mat-icon>
    </button>

  </div>

  <div class="row" >
    @for (items of dataSource; track items.title) {
      <div class="col-12 mb-3">
        <mat-card class="cardWithShadow items overflow-hidden">
          <div class="d-flex gap-3 align-items-start w-100">
            <!-- Imagem à esquerda -->
            <a routerLink="/found_item">
              <img *ngIf="itemImages[items.id]?.length > 0"
                   [src]="itemImages[items.id][0]?.remote_name"
                   alt="Image for {{ items.title }}"
                   class="w-10rem border-round shadow-2" />
            </a>

            <!-- Conteúdo à direita -->
            <mat-card-content class="cardContent">
              <mat-card-title class="mat-headline-2 f-s-16 m-b-4">
                {{ items.title }}
              </mat-card-title>

              <div class="d-flex align-items-center gap-3 mb-2">
                <h5 class="mat-body-2 f-w-600 m-0">{{ items.city }}</h5>
                <h5 class="mat-body-2 f-w-600 m-0">{{ items.date_found | date:'shortDate' }}</h5>
              </div>

              <p class="f-s-14 m-0">{{ items.description }}</p>

              <button
                mat-raised-button
                class="mt-3"
                matTooltip="meu item"
                (click)="goToPage('itemFound/' + items.id)">
                Item lost
              </button>
            </mat-card-content>
          </div>
        </mat-card>
      </div>
    }

  </div>

  @if (dataSource.length === 0) {
    <div class="flex flex-center">
      <h2>Nenhum Item encontrado</h2>
    </div>
  }
</div>
  </div>
</div>
