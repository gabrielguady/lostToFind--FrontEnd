<!-- Header -->
<header class="app-header">
  <div class="flex align-items-center gap-2 px-3 py-2">
    <span class="text-black font-bold text-xl">Lost to Find</span>
    <div class="logo-mask">
      <video autoplay loop muted playsinline>
        <source src="assets/logo-moving.mp4" type="video/mp4" />
      </video>
    </div>
  </div>

  <!-- Botões à direita -->
  <div class="flex gap-4 ml-auto m-3">
    <button class=" lost-b " mat-button routerLink="/lost_item">Itens Perdidos</button>
    <button class=" found-b " mat-button  routerLink="/found_item">Itens Encontrados</button>
    <button class=" myitem-b " mat-button routerLink="/my_items">Meus Itens</button>
    <button class="user" mat-icon-button routerLink="/user">
      <mat-icon>account_circle</mat-icon>
    </button>
  </div>
</header>

<div class="flex justify-content-center px-4 mt-5">
  <div class="surface-card w-full md:w-11 lg:w-10 xl:w-9 p-5 shadow-3 border-round-xl">

<div class="flex flex-column gap-1">
  <h1>
    Cadastro de Item Perdido
  </h1>

  <form [formGroup]="formGroup">
    <div class="flex flex-column gap-3 mb-4">
      <mat-form-field>
        <mat-label>Título</mat-label>
        <input matInput type="text" formControlName="title" appAutofocus required>
        <mat-error>Campo Inválido</mat-error>
      </mat-form-field>
      <mat-form-field>
        <mat-label>Detalhes</mat-label>
        <input matInput type="text" formControlName="last_seen_details" required>
        <mat-error>Campo Inválido</mat-error>
      </mat-form-field>
      <mat-form-field>
        <mat-label>Data perdida</mat-label>
        <input matInput [matDatepicker]="picker" formControlName="date_lost" required>
        <mat-hint>MM/DD/YYYY</mat-hint>
        <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
      </mat-form-field>
      <mat-form-field>
        <mat-label>Recompensa</mat-label>
        <input matInput type="number" formControlName="reward" required>
        <mat-error>Campo Inválido</mat-error>
      </mat-form-field>
      <mat-form-field>
        <mat-label>Categoria</mat-label>
        <mat-select formControlName="category">
          @for (cat of categories; track cat) {
            <mat-option [value]="cat.value">{{ cat.label }}</mat-option>
          }
        </mat-select>
      </mat-form-field>
      <mat-form-field>
        <mat-label>Cidade</mat-label>
        <input matInput type="text" formControlName="city" required>
        <mat-error>Campo Inválido</mat-error>
      </mat-form-field>
    </div>
    <button mat-flat-button class="btn-default" id="save" type="submit"
            (click)="saveOrUpdate()"
            [disabled]="!formGroup.valid" routerLink="/lost_item">
      Salvar Item Perdido
    </button>

  </form>

  <app-add-photo-lost *ngIf="itemIdEmitter" [id_item_lost]="this.object.id"></app-add-photo-lost>
</div>

  </div>
</div>
