
<div class="title-container md:text-center">
  <h2 class="page-title  ">User Profile</h2>
  <p class="page-subtitle">Manage your personal information</p>
</div>

<mat-card class="user-card">
  <div class="user-header">
    <mat-icon class="user-icon">account_circle</mat-icon>
    <div class="user-info">
      <!--      <div class="user-name">User Name</div>-->
      <!--          USERNAME AQUI-->
      <div class="user-name">{{ name }}</div>
      <div class="user-member">Member since 2024</div>
    </div>
  </div>

  <mat-form-field appearance="fill" class="user-form-field">
    <mat-label>Full Name</mat-label>
    <input matInput type="name" placeholder="Enter your name" [readonly]="!isEditing">
  </mat-form-field>

  <div class="user-form-grid">
    <mat-form-field appearance="fill" class="user-form-field">
      <mat-label>Email</mat-label>
      <input matInput type="email" [(ngModel)]="email" [readonly]="!isEditing">
    </mat-form-field>

    <mat-form-field appearance="fill" class="user-form-field">
      <mat-label>Phone</mat-label>
      <input matInput type="text" [(ngModel)]="phone" [readonly]="!isEditing">
    </mat-form-field>
  </div>

  <div class="save-quit" *ngIf="isEditing">
    <button mat-raised-button color="primary" (click)="save()">Salvar</button>
    <button mat-raised-button color="warn" (click)="cancel()">Cancelar</button>
  </div>

  <div class="edit-button" *ngIf="!isEditing">
    <button mat-raised-button (click)="edit()">Editar</button>
  </div>
</mat-card>
